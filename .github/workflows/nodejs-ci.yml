# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Test build scripts
        run: node --test scripts/*.node-test.cjs
      - run: npm ci --legacy-peer-deps
      - run: npm run format:check
      - run: npm run lint

  test:
    name: 'Test'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chromium]
        react: ['React18', 'React19']

    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on runner
        if: runner.os == 'Linux' # ubuntu-latest is Linux
        run: |
          echo "Initial disk space:"
          df -h
          sudo docker image prune -a -f || echo "Docker image prune failed or Docker not available"
          sudo rm -rf /usr/share/dotnet || echo "Failed to remove dotnet or it doesn't exist"
          sudo rm -rf /opt/ghc || echo "Failed to remove ghc or it doesn't exist"
          sudo rm -rf /usr/local/lib/android || echo "Failed to remove android or it doesn't exist"
          sudo rm -rf /usr/local/share/powershell || echo "Failed to remove powershell or it doesn't exist"
          sudo rm -rf /usr/local/share/rust || echo "Failed to remove rust or it doesn't exist"
          sudo rm -rf /opt/hostedtoolcache || echo "Failed to remove hostedtoolcache"
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/apt/lists/*
          npm cache clean --force || echo "npm cache clean failed"
          echo "Disk space after cleanup:"
          df -h

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm # npm cache files are stored in `~/.npm` on Linux/macOS
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: install react 18
        if: ${{ matrix.react == 'React18' }}
        run: npm run install:react-18

      - name: install react 19
        if: ${{ matrix.react == 'React19' }}
        run: npm run install:react-19

      - name: Run headless tests
        run: npm run test:ci -- --browser.headless
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}

      - name: Run SSR hydration tests
        if: ${{ matrix.browser == 'chromium' }}
        run: npm run test:ssr

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.browser }}
          fail_ci_if_error: true

  # Keep each Firefox shard on its own runner so native keyboard tests retain one page.
  firefox-react18:
    name: 'Firefox runners (React18)'
    uses: ./.github/workflows/firefox-tests.yml
    with:
      react-version: React18
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  firefox-react19:
    name: 'Firefox runners (React19)'
    uses: ./.github/workflows/firefox-tests.yml
    with:
      react-version: React19
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  firefox-react18-summary:
    name: 'Test (firefox, React18)'
    needs: firefox-react18
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Keep the existing required check closed on failed, cancelled, or skipped shards.
      - name: Require all Firefox shards to pass
        env:
          SHARD_RESULT: ${{ needs.firefox-react18.result }}
        run: test "$SHARD_RESULT" = success

  firefox-react19-summary:
    name: 'Test (firefox, React19)'
    needs: firefox-react19
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all Firefox shards to pass
        env:
          SHARD_RESULT: ${{ needs.firefox-react19.result }}
        run: test "$SHARD_RESULT" = success

  public-declarations:
    name: 'Public declarations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - name: Install locked declaration consumers
        run: npm ci --prefix test/public-declarations --legacy-peer-deps --ignore-scripts
      - name: Build the public declaration package
        run: npm run build:ts && npm run build:types
      - name: Check React 18 and 19 public declarations
        run: npm run test:public-types
      - name: Retain declaration diagnostics and loaded types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-declaration-consumers
          path: test/public-declarations/results
          if-no-files-found: ignore
