name: Size Limit
on:
  pull_request:
    branches:
      - main
      - next

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Use the runner cache without a network lookup for the LTS alias.
          node-version: '24'

      - name: Install dependencies
        run: npm i --legacy-peer-deps

      - name: Run Size Limit
        run: npm run size
