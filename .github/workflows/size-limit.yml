name: Size Limit
on:
  pull_request:
    # Keep legacy v4 and root *.x maintenance targets out of PR checks.
    branches-ignore:
      - v4
      - '*.x'

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm i --legacy-peer-deps

      - name: Run Size Limit
        run: npm run size
