name: Chromium tests

on:
  workflow_call:
    inputs:
      react-version:
        required: true
        type: string
      react-runtime:
        required: true
        type: string

jobs:
  test:
    # Preserve component check names while giving native tests their own runners.
    name: "${{ matrix.suite == 'native' && 'Chromium native' || 'Chromium' }} shard (${{ matrix.shard }}/2)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Keep independent suites and shards running when another one fails.
      fail-fast: false
      matrix:
        suite: [components, native]
        shard: [1, 2]
    env:
      VITE_RSUITE_REACT_VERSION: ${{ inputs.react-runtime }}
    steps:
      - uses: actions/checkout@v4
      - name: Report runner disk space
        if: runner.os == 'Linux' # ubuntu-latest is Linux
        run: df -h

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          # Use the runner cache without a network lookup for the LTS alias.
          node-version: '24'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm # npm cache files are stored in `~/.npm` on Linux/macOS
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: install react 18
        if: ${{ inputs.react-version == 'React18' }}
        run: npm run install:react-18

      - name: install react 19
        if: ${{ inputs.react-version == 'React19' }}
        run: npm run install:react-19

      - name: Install React 19.3.0
        if: ${{ inputs.react-version == 'React19.3' }}
        run: npm run install:react-19-3

      - name: Verify installed React runtime
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const React = require('react');
          const ReactDOM = require('react-dom');
          const expected = process.env.VITE_RSUITE_REACT_VERSION;
          console.log({ expected, react: React.version, reactDOM: ReactDOM.version });
          assert.equal(React.version, expected);
          assert.equal(ReactDOM.version, expected);
          if (expected === '19.3.0') assert.ok(React.Activity, 'Activity tests require this runtime');
          NODE

      # Provision the browser for the final dependency tree after selecting React.
      - name: Install Playwright Browsers
        run: node scripts/install-browser-ci.cjs chromium

      - name: Run headless tests
        id: component-tests
        if: matrix.suite == 'components'
        run: npm run test:ci -- --browser.headless --shard=${{ matrix.shard }}/2
        env:
          CI: true
          # Keep browser stderr and process exits when an RPC connection disappears.
          DEBUG: pw:browser
          BROWSER: chromium

      - name: Retain component failure screenshots
        if: ${{ !cancelled() && steps.component-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: component-failure-screenshots-chromium-${{ inputs.react-version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: src/**/__screenshots__/**/*.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Retain browser coverage
        if: matrix.suite == 'components'
        uses: actions/upload-artifact@v4
        with:
          name: browser-coverage-chromium-${{ inputs.react-version }}-${{ matrix.shard }}
          path: |
            coverage/coverage-final.json
            coverage/clover.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Run SSR hydration tests
        id: ssr-tests
        # An artifact-service failure must not suppress independent test results.
        if: ${{ !cancelled() && steps.component-tests.outcome == 'success' && matrix.shard == 1 }}
        run: npm run test:ssr -- --coverage --coverage.reportsDirectory=coverage-ssr

      - name: Retain SSR coverage
        if: ${{ !cancelled() && steps.ssr-tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-${{ inputs.react-version }}
          path: |
            coverage-ssr/coverage-final.json
            coverage-ssr/clover.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Run native browser control tests
        # Component tests and coverage uploads run on separate runners.
        if: matrix.suite == 'native'
        run: npm run test:browser-controls -- --shard=${{ matrix.shard }}/2
        env:
          BROWSER: chromium
          # Retain process shutdown evidence when a native test cleanup times out.
          DEBUG: pw:browser
